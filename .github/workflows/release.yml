name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install release tooling
        run: python -m pip install --upgrade build twine

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -c "import os, pathlib, tomllib;
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'];
          expected = f'v{version}';
          actual = os.environ['RELEASE_TAG'];
          assert actual == expected, f'release tag {actual!r} must equal {expected!r}'"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Verify expected release files
        run: >-
          python -c "import pathlib, tomllib;
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'];
          actual = {path.name for path in pathlib.Path('dist').iterdir()};
          expected = {f'bourneprov-{version}-py3-none-any.whl', f'bourneprov-{version}.tar.gz'};
          assert actual == expected, f'expected {sorted(expected)}, found {sorted(actual)}'"

      - name: Test installed wheel
        run: |
          python -m venv /tmp/bourne-release-check
          /tmp/bourne-release-check/bin/python -m pip install --no-index dist/*.whl
          PYTHONDONTWRITEBYTECODE=1 /tmp/bourne-release-check/bin/python -W error::ResourceWarning -m unittest discover -s tests -v
          /tmp/bourne-release-check/bin/python -m pip check
          /tmp/bourne-release-check/bin/bourne --version

      - name: Store release distributions
        uses: actions/upload-artifact@v5
        with:
          name: bourneprov-release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bourneprov
    permissions:
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v6
        with:
          name: bourneprov-release-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  attach-release-assets:
    name: Attach distributions to GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v6
        with:
          name: bourneprov-release-distributions
          path: dist/

      - name: Attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
